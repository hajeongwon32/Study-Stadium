<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Stadium 회원가입</title>
    <link rel="stylesheet" href="../css/login.css">
    <script type="module" src="../js/sign-up.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <header class="pitch">
                <p class="pitch-eyebrow">STUDY STADIUM</p>
                <h1 id="page-title">선수 등록</h1>
                <p class="pitch-copy">닉네임과 비밀번호만 있으면 돼요</p>
            </header>

            <form class="auth-form signup-form">
                <div class="field-group">
                    <label for="signup-name">닉네임</label>
                    <div class="name-check-row">
                        <input id="signup-name" type="text" placeholder="다른 선수에게 보일 이름" autocomplete="username" required>
                        <button class="check-name-button" type="button">중복 확인</button>
                    </div>
                    <p class="name-status" aria-live="polite"></p>
                </div>

                <div class="field-group">
                    <label for="signup-password">비밀번호</label>
                    <div class="password-wrap">
                        <input id="signup-password" type="password" placeholder="6자리 이상" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" aria-label="비밀번호 표시">보기</button>
                    </div>
                </div>

                <p class="form-message" aria-live="polite"></p>

                <button class="submit-button" type="submit">선수 등록</button>

                <p class="switch-link">이미 선수라면 <a href="login.html">로그인</a></p>
            </form>
        </section>
    </main>
</body>
</html>
