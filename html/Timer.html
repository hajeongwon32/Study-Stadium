<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Stadium 오늘의 경기</title>
    <link rel="stylesheet" href="../css/Timer.css">
    <script type="module" src="../js/Timer.js"></script>
</head>

<body>

    <main class="match-shell">
        <section class="match-card" aria-labelledby="match-title">

            <!-- HEADER -->
            <header class="match-header">
                <div class="title-row">
                    <span class="status-dot" aria-hidden="true"></span>
                    <h1 id="match-title">TODAY'S MATCH</h1>
                    <div class="header-actions">
                        <button class="icon-button" type="button" aria-label="도움말">?</button>
                        <button id="logout-button" class="icon-button" type="button" aria-label="로그아웃">↪</button>
                    </div>
                </div>
            </header>

            <!-- SET 진행 상태 -->
            <nav class="set-progress" aria-label="경기 진행 단계">
                <div class="progress-line" aria-hidden="true">
                    <span id="progress-line-fill"></span>
                </div>

                <!-- 1SET -->
                <div class="progress-step" data-step="1">
                    <span class="step-marker"></span>
                    <strong>1SET</strong>
                </div>

                <!-- 2SET -->
                <div class="progress-step" data-step="2">
                    <span class="step-marker"></span>
                    <strong>2SET</strong>
                </div>

                <!-- 하이드레이션 브레이크 / 하프타임 -->
                <div class="progress-step" data-step="break">
                    <span class="step-marker"></span>
                    <strong>
                        <span id="break-step-title">HALF TIME</span>
                    </strong>
                </div>

                <!-- 3SET -->
                <div class="progress-step" data-step="3">
                    <span class="step-marker"></span>
                    <strong>3SET</strong>
                </div>

                <!-- 4SET -->
                <div class="progress-step" data-step="4">
                    <span class="step-marker"></span>
                    <strong>4SET</strong>
                </div>
            </nav>

            <!-- CONTENT -->
            <div class="match-content">

                <p class="break-label">
                    <span class="break-dot" aria-hidden="true"></span>
                    <span id="mode-label">1SET</span>
                </p>

                <!-- TIMER -->
                <section class="timer-panel" aria-labelledby="timer-title">
                    <button id="settingBtn" class="setting-button" type="button">시간 설정</button>
                    <h2 id="timer-title">
                        <span id="timer-title-text">FOCUS TIME REMAINING</span>
                    </h2>
                    <time id="timer" datetime="PT25M">25:00</time>
                    <div class="timer-track" aria-hidden="true">
                        <span id="timer-progress"></span>
                    </div>
                    <p id="timer-status" class="timer-status" role="status">
                        집중 시간이 진행 중입니다.
                    </p>
                </section>

                <!-- 시간 설정 모달 -->
                <div id="settingModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="setting-title">
                    <div class="modal-content">
                        <h2 id="setting-title">시간 설정</h2>

                        <label for="focusTime">집중 시간</label>
                        <div class="setting-input">
                            <input type="number" id="focusTime" min="1" max="90" value="25">
                            <span>분</span>
                        </div>

                        <div class="modal-buttons">
                            <button id="cancelBtn" class="modal-cancel" type="button">취소</button>
                            <button id="saveBtn" class="modal-save" type="button">저장</button>
                        </div>
                    </div>
                </div>

                <!-- 공부 노트 작성 모달 -->
                <div id="noteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="note-title">
                    <div class="modal-content note-modal-content">
                        <h2 id="note-title">오늘의 공부 노트</h2>
                        <p class="note-modal-message">오늘 공부하면서 기억하고 싶은 내용을 남겨보세요.</p>
                        <textarea id="studyNoteInput" maxlength="1000" placeholder="오늘 학습 내용을 입력해 주세요"></textarea>
                        <div class="modal-buttons">
                            <button id="noteCancelBtn" class="modal-cancel" type="button">취소</button>
                            <button id="noteSaveBtn" class="modal-save" type="button">저장하고 종료</button>
                        </div>
                    </div>
                </div>
                <!-- TIP -->
                <aside class="break-tip">
                    <span class="tip-icon" aria-hidden="true">♧</span>
                    <div>
                        <strong id="tip-title">집중해서 첫 번째 세트를 완료해보세요!</strong>
                        <p id="tip-description">지금부터 1SET 집중 시간이 시작됩니다.</p>
                    </div>
                </aside>

                <!-- BUTTON -->
                <div class="timer-actions">
                    <button id="toggle-timer" class="primary-action" type="button">
                        ▶&nbsp; 시작
                    </button>
                    <button id="finish-today" class="finish-action" type="button">
                        오늘은 여기까지
                    </button>
                </div>

            </div>
        </section>
    </main>
</body>
</html>
