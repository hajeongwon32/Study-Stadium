<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Stadium 오늘의 경기</title>
    <link rel="stylesheet" href="../css/Timer.css">
</head>

<body>

    <main class="match-shell">

        <section class="match-card" aria-labelledby="match-title">

            <!-- HEADER -->
            <header class="match-header">
                <div class="title-row">

                    <span class="status-dot" aria-hidden="true"></span>

                    <h1 id="match-title">TODAY'S MATCH</h1>

                    <div class="header-actions">
                        <button class="icon-button" type="button" aria-label="도움말">
                            ?
                        </button>

                        <a class="icon-button" href="Login.html" aria-label="로그아웃">
                            ↪
                        </a>
                    </div>

                </div>
            </header>


            <!-- SET 진행 상태 -->
            <nav class="set-progress" aria-label="경기 진행 단계">

                <div class="progress-line" aria-hidden="true">
                    <span id="progress-line-fill"></span>
                </div>

                <!-- 1SET -->
                <div class="progress-step" data-step="1">
                    <span class="step-marker"></span>
                    <strong>1SET</strong>
                </div>

                <!-- 2SET -->
                <div class="progress-step" data-step="2">
                    <span class="step-marker"></span>
                    <strong>2SET</strong>
                </div>

                <!-- 하이드레이션 브레이크 -->
                <div class="progress-step" data-step="break">
                    <span class="step-marker"></span>
                    <strong>
                        <span id="break-step-title">HALF TIME</span>
                    </strong>
                </div>

                <!-- 3SET -->
                <div class="progress-step" data-step="3">
                    <span class="step-marker"></span>
                    <strong>3SET</strong>
                </div>

                <!-- 4SET -->
                <div class="progress-step" data-step="4">
                    <span class="step-marker"></span>
                    <strong>4SET</strong>
                </div>

            </nav>


            <!-- CONTENT -->
            <div class="match-content">

                <p class="break-label">
                    <span aria-hidden="true"></span>
                    <span id="mode-label">1SET</span>
                </p>


                <!-- TIMER -->
                <section class="timer-panel" aria-labelledby="timer-title">

                    <h2 id="timer-title">
                        <span id="timer-title-text">FOCUS TIME REMAINING</span>
                    </h2>

                    <time id="timer" datetime="PT4M">
                        04:00
                    </time>

                    <div class="timer-track" aria-hidden="true">
                        <span id="timer-progress"></span>
                    </div>

                    <p id="timer-status" class="timer-status" role="status">
                        집중 시간이 진행 중입니다.
                    </p>

                </section>


                <!-- TIP -->
                <aside class="break-tip">

                    <span class="tip-icon" aria-hidden="true">
                        ♧
                    </span>

                    <div>
                        <strong id="tip-title">
                            집중해서 첫 번째 세트를 완료해보세요!
                        </strong>

                        <p id="tip-description">
                            지금부터 1SET 집중 시간이 시작됩니다.
                        </p>
                    </div>

                </aside>


                <!-- BUTTON -->
                <div class="timer-actions">

                    <button
                        id="toggle-timer"
                        class="primary-action"
                        type="button"
                    >
                        Ⅱ&nbsp; 일시정지
                    </button>

                    <button
                        id="reset-timer"
                        class="secondary-action"
                        type="button"
                    >
                        ↻ 다시 시작
                    </button>

                </div>


                <!-- 경기 진행 상황 -->
                <section
                    class="match-summary"
                    aria-labelledby="summary-title"
                >

                    <div class="summary-heading">

                        <h2 id="summary-title">
                            진행상황
                        </h2>

                        <span id="summary-status">
                            경기 진행 중
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            완료한 세트
                        </span>

                        <strong>
                            <span id="completed-sets">0</span>
                            &nbsp;/&nbsp;
                            4 SETS
                        </strong>

                    </div>


                    <div
                        class="set-bars"
                        aria-label="완료한 세트"
                    >

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="summary-row">

                        <span>
                            총 집중 시간
                        </span>

                        <strong>
                            <span id="total-focus-time">0</span>분
                        </strong>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           타이머 기본 설정
        ========================= */

        // 테스트할 때는 4분
        const STUDY_SECONDS = 4 * 60;

        // 실제 프로젝트에서는 이렇게 사용
        // const STUDY_SECONDS = 25 * 60;


        const HYDRATION_BREAK_SECONDS = 5 * 60;
        const HALF_TIME_SECONDS = 10 * 60;


        /* =========================
           현재 경기 상태
        ========================= */

        let currentSet = 1;

        let mode = 'study';

        let breakType = 'hydration';

        let nextSet = 0;

        let remainingSeconds = STUDY_SECONDS;

        let timerId = null;

        let completedSets = 0;

        let totalFocusMinutes = 0;


        /* =========================
           HTML 요소 가져오기
        ========================= */

        const timer =
            document.querySelector('#timer');

        const timerProgress =
            document.querySelector('#timer-progress');

        const timerStatus =
            document.querySelector('#timer-status');

        const toggleTimerButton =
            document.querySelector('#toggle-timer');

        const resetTimerButton =
            document.querySelector('#reset-timer');

        const modeLabel =
            document.querySelector('#mode-label');

        const timerTitleText =
            document.querySelector('#timer-title-text');

        const breakStepTitle =
            document.querySelector('#break-step-title');

        const tipTitle =
            document.querySelector('#tip-title');

        const tipDescription =
            document.querySelector('#tip-description');

        const completedSetsText =
            document.querySelector('#completed-sets');

        const totalFocusTimeText =
            document.querySelector('#total-focus-time');

        const summaryStatus =
            document.querySelector('#summary-status');

        const progressSteps =
            document.querySelectorAll('.progress-step');

        const setBars =
            document.querySelectorAll('.set-bars span');

        const progressLineFill =
            document.querySelector('#progress-line-fill');


        /* =========================
           시간 표시
        ========================= */

        const formatTime = (seconds) => {

            const minutes =
                Math.floor(seconds / 60)
                    .toString()
                    .padStart(2, '0');

            const remainder =
                (seconds % 60)
                    .toString()
                    .padStart(2, '0');

            return `${minutes}:${remainder}`;
        };


        /* =========================
           타이머 화면 업데이트
        ========================= */

        const renderTimer = () => {

            timer.textContent =
                formatTime(remainingSeconds);


            timer.dateTime =
                `PT${Math.floor(remainingSeconds / 60)}M${remainingSeconds % 60}S`;


            const totalSeconds =
                mode === 'study'
                    ? STUDY_SECONDS
                    : breakType === 'halftime'
                        ? HALF_TIME_SECONDS
                        : HYDRATION_BREAK_SECONDS;


            const progress =
                (remainingSeconds / totalSeconds) * 100;


            timerProgress.style.width =
                `${progress}%`;

        };


        /* =========================
           SET 진행 UI 업데이트
        ========================= */

        const updateProgress = () => {

            progressSteps.forEach((step) => {

                const stepNumber =
                    step.dataset.step;


                // 기존 상태 제거
                step.classList.remove(
                    'complete',
                    'current'
                );


                // 하이드레이션 브레이크
                if (stepNumber === 'break') {

                    if (mode === 'break') {

                        step.classList.add('current');

                    } else if (currentSet >= 3) {

                        step.classList.add('complete');

                    }

                    return;
                }


                const number =
                    Number(stepNumber);


                // 이미 완료된 SET
                if (number < currentSet) {

                    step.classList.add('complete');

                }


                // 현재 진행 중인 SET
                else if (
                    number === currentSet &&
                    mode === 'study'
                ) {

                    step.classList.add('current');

                }

            });


            /*
             * 진행선
             *
             * 전체 4SET 기준으로
             * 완료된 정도를 표시
             */

            const progress =
                (completedSets / 4) * 100;

            progressLineFill.style.width =
                `${progress}%`;
        };


        /* =========================
           진행상황 UI 업데이트
        ========================= */

        const updateSummary = () => {

            completedSetsText.textContent =
                completedSets;


            totalFocusTimeText.textContent =
                totalFocusMinutes;


            setBars.forEach((bar, index) => {

                if (index < completedSets) {

                    bar.classList.add('complete');

                } else {

                    bar.classList.remove('complete');

                }

            });


            if (completedSets >= 4) {

                summaryStatus.textContent =
                    '경기 종료';

            } else {

                summaryStatus.textContent =
                    '경기 진행 중';

            }

        };


        /* =========================
           화면 내용 업데이트
        ========================= */

        const updateScreen = () => {

            if (mode === 'study') {

                modeLabel.textContent =
                    `${currentSet}SET`;


                timerTitleText.textContent =
                    'FOCUS TIME REMAINING';


                timerStatus.textContent =
                    `${currentSet}SET 집중 시간이 진행 중입니다.`;


                tipTitle.textContent =
                    `${currentSet}SET에 집중해보세요!`;


                tipDescription.textContent =
                    '집중 시간을 완료하면 다음 단계로 이동합니다.';

            }


            else if (mode === 'break') {

                const isHalfTime =
                    breakType === 'halftime';

                const breakTitle =
                    isHalfTime
                        ? '하프 타임'
                        : '하이드레이션 브레이크';

                const breakDescription =
                    isHalfTime
                        ? '전반전이 끝났습니다. 10분간 휴식하세요.'
                        : '수분을 섭취하고 눈의 피로를 풀어주세요.';

                breakStepTitle.innerHTML =
                    isHalfTime
                        ? '하프 타임'
                        : '하이드레이션<br>브레이크';

                modeLabel.textContent =
                    breakTitle;


                timerTitleText.textContent =
                    'BREAK TIME REMAINING';


                timerStatus.textContent =
                    '휴식 시간이 진행 중입니다.';


                tipTitle.textContent =
                    isHalfTime
                        ? '전반전 종료! 충분히 쉬어주세요.'
                        : '잠깐의 휴식으로 집중력을 올려보세요!';


                tipDescription.textContent =
                    breakDescription;

            }


            updateProgress();

            updateSummary();

            renderTimer();

        };


        /* =========================
           SET 종료
        ========================= */

        const finishStudySet = () => {

            clearInterval(timerId);

            timerId = null;


            // 완료 SET 증가
            completedSets++;


            // 집중 시간 추가
            totalFocusMinutes += 4;


            /*
             * 1SET → 하이드레이션 브레이크 → 2SET
             */

            if (currentSet === 1) {

                mode = 'break';
                breakType = 'hydration';
                nextSet = 2;

                remainingSeconds =
                    HYDRATION_BREAK_SECONDS;

                timerStatus.textContent =
                    '1SET 완료! 5분 하이드레이션 브레이크입니다.';

                updateScreen();

                startTimer();

                return;
            }


            /*
             * 2SET → 하프 타임 → 3SET
             */

            if (currentSet === 2) {

                mode = 'break';
                breakType = 'halftime';
                nextSet = 3;

                remainingSeconds =
                    HALF_TIME_SECONDS;

                timerStatus.textContent =
                    '2SET 완료! 10분 하프 타임입니다.';

                updateScreen();

                startTimer();

                return;
            }


            /*
             * 3SET → 하이드레이션 브레이크 → 4SET
             */

            if (currentSet === 3) {

                mode = 'break';
                breakType = 'hydration';
                nextSet = 4;

                remainingSeconds =
                    HYDRATION_BREAK_SECONDS;

                timerStatus.textContent =
                    '3SET 완료! 5분 하이드레이션 브레이크입니다.';

                updateScreen();

                startTimer();

                return;
            }


            /*
             * 4SET 종료
             */

            if (currentSet === 4) {

                finishMatch();

            }

        };


        /* =========================
           브레이크 종료
        ========================= */

        const finishBreak = () => {

            clearInterval(timerId);

            timerId = null;


            // 다시 공부 모드
            mode = 'study';

            currentSet = nextSet;

            remainingSeconds =
                STUDY_SECONDS;


            timerStatus.textContent =
                '하이드레이션 브레이크 종료! 3SET을 시작합니다.';


            updateScreen();

            startTimer();

        };


        /* =========================
           경기 종료
        ========================= */

        const finishMatch = () => {

            clearInterval(timerId);

            timerId = null;

            remainingSeconds = 0;

            renderTimer();


            modeLabel.textContent =
                'FULL TIME';


            timerTitleText.textContent =
                'MATCH COMPLETE';


            timerStatus.textContent =
                '오늘의 경기가 종료되었습니다!';


            tipTitle.textContent =
                '오늘의 공부를 완료했습니다!';


            tipDescription.textContent =
                '수고하셨습니다. 오늘의 기록이 저장됩니다.';


            toggleTimerButton.textContent =
                '✓ 경기 종료';


            toggleTimerButton.disabled = true;


            resetTimerButton.disabled = true;


            summaryStatus.textContent =
                '경기 종료';


            updateProgress();

            updateSummary();

        };


        /* =========================
           타이머 시작
        ========================= */

        const startTimer = () => {

            clearInterval(timerId);


            timerId = setInterval(() => {

                if (remainingSeconds <= 1) {

                    remainingSeconds = 0;

                    renderTimer();


                    if (mode === 'study') {

                        finishStudySet();

                    } else {

                        finishBreak();

                    }

                    return;
                }


                remainingSeconds--;

                renderTimer();

            }, 1000);


            toggleTimerButton.textContent =
                'Ⅱ  일시정지';

        };


        /* =========================
           일시정지 / 계속하기
        ========================= */

        toggleTimerButton.addEventListener(
            'click',
            () => {

                if (timerId) {

                    // 일시정지
                    clearInterval(timerId);

                    timerId = null;


                    timerStatus.textContent =
                        '타이머가 일시정지되었습니다.';


                    toggleTimerButton.textContent =
                        '▶  계속하기';

                }

                else {

                    // 다시 시작
                    startTimer();


                    if (mode === 'study') {

                        timerStatus.textContent =
                            `${currentSet}SET 집중 시간이 진행 중입니다.`;

                    } else {

                        timerStatus.textContent =
                            '휴식 시간이 진행 중입니다.';

                    }

                }

            }
        );


        /* =========================
           다시 시작 버튼
        ========================= */

        resetTimerButton.addEventListener(
            'click',
            () => {

                clearInterval(timerId);

                timerId = null;


                if (mode === 'study') {

                    remainingSeconds =
                        STUDY_SECONDS;

                } else {

                    remainingSeconds =
                        breakType === 'halftime'
                            ? HALF_TIME_SECONDS
                            : HYDRATION_BREAK_SECONDS;

                }


                updateScreen();

                startTimer();

            }
        );


        /* =========================
           처음 실행
        ========================= */

        updateScreen();

        startTimer();

    </script>

</body>
</html>
```
