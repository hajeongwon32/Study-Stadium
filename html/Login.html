<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Stadium 로그인</title>
    <link rel="stylesheet" href="../css/Login.css">
</head>
<body>
    <main class="page-shell">
        <section class="login-card" aria-labelledby="page-title">
            <header class="intro">
                <button class="circle-button back-button" type="button" aria-label="이전 페이지로 이동">←</button>
                <span class="ball-mark" aria-hidden="true">⚽</span>
                <div class="intro-copy">
                    <h1 id="page-title">STUDY STADIUM</h1>
                    <p>선수 입장 &amp; 라커룸 등록 가이드</p>
                </div>
            </header>

            <div class="login-panel">
                <nav class="tabs" aria-label="계정 메뉴">
                    <button class="tab active" type="button" aria-selected="true">로그인</button>
                    <a class="tab tab-link" href="SignUp.html" aria-label="회원가입 페이지로 이동">회원가입</a>
                </nav>

                <form class="login-form" id="login-form">
                    <div class="field-group">
                        <label for="user-id"><span class="field-icon" aria-hidden="true">♙</span> 선수 ID / 이메일</label>
                        <div class="input-wrap">
                            <input id="user-id" type="text" placeholder="아이디 또는 이메일 입력" autocomplete="username">
                            <span class="input-icon" aria-hidden="true">⚿</span>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="user-password"><span class="field-icon" aria-hidden="true">⚿</span> 라커룸 비밀번호 (PW)</label>
                        <div class="input-wrap">
                            <input id="user-password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
                            <button class="password-toggle" type="button" aria-label="비밀번호 표시">◉</button>
                        </div>
                    </div>

                    <label class="remember-option">
                        <input type="checkbox" checked>
                        <span class="checkmark" aria-hidden="true">✓</span>
                        <span>자동 출전 유지 (로그인 유지)</span>
                    </label>

                    <div class="actions">
                        <button class="cancel-button" type="reset">취소</button>
                        <button class="submit-button" type="submit"><span aria-hidden="true">⚽</span> 확인 (Kick-off)</button>
                    </div>
                </form>
            </div>
        </section>

        <footer class="page-footer"><span aria-hidden="true">▣</span> STUDY STADIUM OFFICIAL SECURED LOCKER ROOM</footer>
    </main>
    <script>
        document.querySelector('#login-form').addEventListener('submit', (event) => {
            event.preventDefault();
            window.location.href = 'Match.html';
        });
    </script>
</body>
</html>
