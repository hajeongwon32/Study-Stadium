<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Stadium 로그인</title>
    <link rel="stylesheet" href="../css/login.css">
    <script type="module" src="../js/login.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <header class="pitch">
                <p class="pitch-eyebrow">STUDY STADIUM</p>
                <h1 id="page-title">오늘의 경기,<br>입장하세요</h1>
                <p class="pitch-copy">하루 4세트, 공부를 한 경기처럼</p>
            </header>

            <form class="auth-form" id="login-form">
                <div class="field-group">
                    <label for="user-id">닉네임</label>
                    <input id="user-id" type="text" placeholder="가입할 때 쓴 닉네임" autocomplete="username" required>
                </div>

                <div class="field-group">
                    <label for="user-password">비밀번호</label>
                    <div class="password-wrap">
                        <input id="user-password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
                        <button class="password-toggle" type="button" aria-label="비밀번호 표시">보기</button>
                    </div>
                </div>

                <p class="form-message" aria-live="polite"></p>

                <button class="submit-button" type="submit">로그인</button>

                <p class="switch-link">아직 선수가 아니라면 <a href="sign-up.html">회원가입</a></p>
            </form>
        </section>
    </main>
</body>
</html>
